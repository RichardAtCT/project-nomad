# Project N.O.M.A.D. management services Docker Compose configuration — macOS variant
#
# This compose file is the macOS equivalent of management_compose.yaml. Key differences:
# - Volume paths use ${NOMAD_DIR} (set via .env file generated by the macOS installer)
# - No extra_hosts (host.docker.internal works natively on macOS Docker Desktop)
# - No rslave mount on disk-collector (incompatible with macOS)
# - platform: linux/amd64 on project images (no ARM64 images published yet)
# - OLLAMA_HOST env var for optional native Ollama support on Apple Silicon
#
# Note: we recommend leaving all of the environment variables as-is except for any "replaceme" values,
# which must be updated for the admin server to start successfully.
name: project-nomad
services:
  admin:
    image: ghcr.io/crosstalk-solutions/project-nomad:latest
    platform: linux/amd64 # No ARM64 images published yet — remove once multi-arch builds are available
    pull_policy: always
    container_name: nomad_admin
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ${NOMAD_DIR}/storage:/app/storage # If you change the default storage path, make sure to update the disk-collector config as well!
      - /var/run/docker.sock:/var/run/docker.sock # Allows the admin service to communicate with the Host's Docker daemon
      - nomad-update-shared:/app/update-shared # Shared volume for update communication
    environment:
      - NODE_ENV=production
      # PORT is the port the admin server listens on *inside* the container and should not be changed. If you want to change which port the admin interface is accessible from on the host, you can change the port mapping in the "ports" section (e.g. "9090:8080" to access it on port 9090 from the host)
      - PORT=8080
      - LOG_LEVEL=info
      # APP_KEY needs to be at least 16 chars or will fail validation and container won't start!
      - APP_KEY=replaceme
      # Leave HOST as is so the admin server listens all interfaces within the container - this doesn't affect how you access it from the host, it's just for internal container networking
      - HOST=0.0.0.0
      # URL should be set to the URL you will access the admin interface at (e.g. http://localhost:8080 or http://192.168.1.x:8080)
      - URL=replaceme
      - DB_HOST=mysql
      # If you change the MySQL port, make sure to update this accordingly
      - DB_PORT=3306
      - DB_DATABASE=nomad
      - DB_USER=nomad_user
      # Needs to match the MYSQL_PASSWORD in the mysql service!
      - DB_PASSWORD=replaceme
      - DB_NAME=nomad
      - DB_SSL=false
      - REDIS_HOST=redis
      # If you change the Redis port, make sure to update this accordingly
      - REDIS_PORT=6379
      # OLLAMA_HOST defaults to the containerised Ollama service. For full Metal GPU acceleration on Apple Silicon,
      # install Ollama natively (brew install ollama && ollama serve) and set OLLAMA_HOST=http://host.docker.internal:11434 in your .env file.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  dozzle:
    # Dozzle is an optional container that allows for easily viewing container logs. We recommend including it unless you have a specific reason not to. Note that if you don't install it, the "Service Logs & Metrics" link in Settings that launches Dozzle will not work.
    image: amir20/dozzle:v10.0
    container_name: nomad_dozzle
    restart: unless-stopped
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Allows Dozzle to read logs from the Host's Docker daemon
    environment:
      - DOZZLE_ENABLE_ACTIONS=false # Disabled — unauthenticated container stop/restart on LAN
      - DOZZLE_ENABLE_SHELL=false  # Disabled — shell access + Docker socket = privilege escalation
  mysql:
    image: mysql:8.0
    container_name: nomad_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=replaceme
      - MYSQL_DATABASE=nomad
      - MYSQL_USER=nomad_user
      # Needs to match DB_PASSWORD in the admin service!
      - MYSQL_PASSWORD=replaceme
    volumes:
      - ${NOMAD_DIR}/mysql:/var/lib/mysql # Persist MySQL data on the host
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
  redis:
    image: redis:7-alpine
    container_name: nomad_redis
    restart: unless-stopped
    volumes:
      - ${NOMAD_DIR}/redis:/data # Persist Redis data on the host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
  updater:
    # Updater is a lightweight sidecar container that allows the admin container to be updated from within its own UI
    image: ghcr.io/crosstalk-solutions/project-nomad-sidecar-updater:latest
    platform: linux/amd64 # No ARM64 images published yet — remove once multi-arch builds are available
    pull_policy: always
    container_name: nomad_updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Allows communication with the Host's Docker daemon
      - ${NOMAD_DIR}:/opt/project-nomad # Maps host NOMAD_DIR to the container's expected path so the updater can modify compose.yml
      - nomad-update-shared:/shared # Shared volume for communication with admin container
  disk-collector:
    # Disk Collector collects disk usage information and shares it with the admin container for display in the UI.
    #
    # macOS limitation: The Linux version mounts /:/host:ro,rslave to read real host disk info.
    # This is not compatible with macOS Docker Desktop, so we only mount the storage directory here.
    # The collector's fallback path reports the Docker VM's backing filesystem info, which means
    # detailed per-disk/per-partition stats will NOT be available in the UI on macOS — only the
    # storage volume's filesystem usage will be shown. This is a known macOS limitation.
    image: ghcr.io/crosstalk-solutions/project-nomad-disk-collector:latest
    platform: linux/amd64 # No ARM64 images published yet — remove once multi-arch builds are available
    pull_policy: always
    container_name: nomad_disk_collector
    restart: unless-stopped
    volumes:
      - ${NOMAD_DIR}/storage:/storage

volumes:
  nomad-update-shared:
    driver: local
